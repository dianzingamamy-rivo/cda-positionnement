<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Résultats des stagiaires</title>
    <link rel="stylesheet" href="carte.css" />
    <script type="text/javascript" src="JS/jquery-4.0.0.min.js"></script>
    <!--<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>-->
    <script>
      $(function () {
        $("button").on("click", function () {
          //Data-* en JS
          let bouton = document.querySelector("#local");
          alert(bouton.dataset.ville);
          // en JQuery
          let region = $("#globale").data("region");
          alert(region);
        });
      });
    </script>
    <style>
      * {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 26px;
      }
      div {
        background: #900;
        color: #fff;
        padding: 10px;
        margin: 40px auto;
        width: 100px;
        text-align: center;
      }
      button {
        display: block;
        width: 250px;
        margin: 20px auto;
      }
    </style>
  </head>

  <body>
    <main>
      <button>INFO</button>
      <div data-ville="Lyon-France" id="local">Ville</div>
      <div data-region="Auvergne Rhone-Alpes" id="globale">Région</div>
    </main>
  </body>
</html>
