<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Personal Portfolio Card</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="page">
      <section class="portfolio-card">
        <!-- Partie gauche -->
        <div class="profile">
          <div class="profile-top">
            <span class="available">
              <span class="dot"></span>
              Available for work
            </span>

            <button class="menu">
              <span></span>
              <span></span>
              <span></span>
            </button>
          </div>

          <div class="profile-content">
            <div class="avatar">
              <img
                src="https://i.pravatar.cc/300?img=12"
                alt="Photo de profil"
              />
            </div>

            <p class="eyebrow">HELLO, I'M</p>

            <h1>
              Alex<br />
              Morgan
            </h1>

            <p class="role">
              Product Designer &<br />
              Front-end Developer
            </p>

            <p class="description">
              I create digital experiences that combine thoughtful design with
              clean and functional code.
            </p>

            <a href="#contact" class="contact-button">
              Let's talk
              <span>↗</span>
            </a>
          </div>

          <div class="socials">
            <a href="#">Dribbble</a>
            <a href="#">Behance</a>
            <a href="#">LinkedIn</a>
          </div>
        </div>

        <!-- Partie droite -->
        <div class="visual">
          <div class="visual-header">
            <span>PORTFOLIO</span>
            <span>2026</span>
          </div>

          <div class="circle circle-one"></div>
          <div class="circle circle-two"></div>

          <div class="graphic">
            <div class="graphic-card card-one">
              <span>01</span>
              <strong>UI/UX</strong>
            </div>

            <div class="graphic-card card-two">
              <span>02</span>
              <strong>WEB</strong>
            </div>

            <div class="graphic-card card-three">
              <span>03</span>
              <strong>BRAND</strong>
            </div>
          </div>

          <div class="scroll">
            <span>SCROLL TO EXPLORE</span>
            <div class="scroll-line"></div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
