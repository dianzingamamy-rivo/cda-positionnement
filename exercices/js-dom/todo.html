  <body>
    <main>
      <form>
        <!-- crée le formulaire, tous les champs à remplir, à 
            saisir par l'utilisateur se trouvent à l'intérieur de "form"-->
        <label for="form-ajouter">
          <!--le label est l'étiquette du champ à saisir, 
                l'information à donner ou à faire-->
          Ajouter une tache
        </label>
        <input id="champ-ajouter" type="text" />
        <!--le input crée la zone de remplissage, le champ où l'utilisateur
            saisit l'information. On associe généralement le label et le 
            input puisqu'il faut associer l'étiquette à sa zone de 
            remplissage. le "for" du label est le "id" du input. et on 
            spécifie le type du input, pour savoir s'il s'agit d'un texte, 
            d'un nombre...à saisir-->
      </form>
      <button id="bouton-ajouter">
        <!--permet de créer un bouton, et ici ce bouton 
            est placé dans le formulaire -->
        Ajouter
      </button>
      <ol class="liste-ajouter">
        <!-- ol (ordered list) est une liste ordonnée, généralement 
             affichée sous forme de liste numérotée. contrairement 
             à ul (unordered list) qui présente juste des tirets. les 
             deux types de listes ul et ol utilisent li -->
      </ol>
    </main>
  </body>
