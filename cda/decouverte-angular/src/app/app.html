<header>
  <mat-toolbar>
    <span class="app-name">{{ appName }}</span>
    <nav aria-label="Navigation principale">
      <a
        matButton
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
      >
        Accueil
      </a>
      <a matButton routerLink="/equipe" routerLinkActive="active" ariaCurrentWhenActive="page">
        Équipe
      </a>
      <a matButton routerLink="/ajouter" routerLinkActive="active" ariaCurrentWhenActive="page">
        Ajouter
      </a>
    </nav>
  </mat-toolbar>
</header>

<main class="container">
  <!-- La page correspondant a l'adresse s'affiche ici. -->
  <ul class="grid-auto list" role="list">
    <li><app-stat-card label="Congés payés restants" [value]="10" unit="jours" [max]="25" /></li>
    <li><app-stat-card label="RTT restants" [value]="6" unit="jours" /></li>
  </ul>
  <router-outlet />
</main>
